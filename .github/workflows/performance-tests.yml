name: Performance Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  performance-benchmarks:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance benchmarks
        run: npm run test:performance
        env:
          CI: true

      - name: Export benchmark results
        run: |
          mkdir -p performance-reports
          node -e "
            const fs = require('fs');
            const { performanceMetrics } = require('./dist/core/PerformanceMetrics');
            const summary = performanceMetrics.exportStatsSummary();
            fs.writeFileSync('performance-reports/benchmark-results.json', JSON.stringify(summary, null, 2));
          "

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmarks
          path: performance-reports/
          retention-days: 30

      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          node scripts/compare-performance.js \
            --baseline origin/main \
            --current HEAD \
            --threshold 10

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('performance-reports/benchmark-results.json', 'utf-8'));
            
            const comment = `
            ## 📊 Performance Benchmark Results
            
            ### Frame Performance
            - **Average FPS:** ${results.frames?.fps.mean.toFixed(2)}
            - **P95 Frame Time:** ${results.frames?.frameTime.p95.toFixed(2)}ms
            - **Target:** 60 FPS (16.67ms per frame)
            
            ### Operations
            ${Object.entries(results.operations).map(([name, stats]) => 
              `- **${name}:** ${stats.mean.toFixed(2)}ms (P95: ${stats.p95.toFixed(2)}ms)`
            ).join('\n')}
            
            ### Memory
            - **Current Usage:** ${(results.memory.current?.usedJSHeapSize / 1024 / 1024).toFixed(2)}MB
            - **Peak Usage:** ${(results.memory.peak / 1024 / 1024).toFixed(2)}MB
            
            ---
            *Performance tests run on commit ${context.sha.slice(0, 7)}*
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  performance-regression:
    name: Check Performance Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run regression tests
        run: npm run test:regression

      - name: Check performance targets
        run: |
          # Fail if any target is missed
          npm run validate:performance

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview &
          npx wait-on http://localhost:4173

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Analyze bundle size
        run: |
          # Check bundle sizes
          node scripts/check-bundle-size.js

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sizes = JSON.parse(fs.readFileSync('dist/bundle-sizes.json', 'utf-8'));
            
            const comment = `
            ## 📦 Bundle Size Report
            
            | Chunk | Size | Gzipped |
            |-------|------|---------|
            ${sizes.chunks.map(chunk => 
              `| ${chunk.name} | ${chunk.size} | ${chunk.gzip} |`
            ).join('\n')}
            
            **Total:** ${sizes.total.size} (${sizes.total.gzip} gzipped)
            
            ${sizes.hasRegression ? '⚠️ **Warning:** Bundle size increased!' : '✅ Bundle size is within limits'}
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
