name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Lint and Type Check (Fast feedback)
  lint-and-typecheck:
    runs-on: ubuntu-latest
    name: Lint & Type Check

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine base ref (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "BASE_REF=${{ github.base_ref }}" >> $GITHUB_ENV

      - name: Fetch base branch (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=1 origin $BASE_REF || true

      - name: Lint changed files (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          CHANGED="$(git diff --name-only origin/$BASE_REF...HEAD | grep -E '\.(ts|tsx)$' || true)"
          if [ -z "$CHANGED" ]; then
            echo "No TS/TSX changes in PR. Skipping ESLint."
          else
            echo "Linting changed files:"
            echo "$CHANGED"
            echo "$CHANGED" | xargs npx eslint --max-warnings=0
          fi

      - name: Run linter (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npm run lint

      - name: Full repo lint (PR advisory)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: npm run lint

      - name: Type check
        run: npm run type-check

  # Job 2: Unit Tests with Coverage
  test:
    runs-on: ubuntu-latest
    name: Unit Tests

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine base ref (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "BASE_REF=${{ github.base_ref }}" >> $GITHUB_ENV

      - name: Fetch base branch (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=1 origin $BASE_REF || true

      - name: Run tests for changed files (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          CHANGED="$(git diff --name-only origin/$BASE_REF...HEAD | grep -E '\.(ts|tsx)$' || true)"
          if [ -z "$CHANGED" ]; then
            echo "No TS/TSX changes in PR. Running minimal smoke test."
            npx vitest --run --passWithNoTests src/routing || echo "Smoke test completed"
          else
            echo "Running tests for changed files:"
            echo "$CHANGED"
            echo "$CHANGED" | xargs npx vitest --run --passWithNoTests
          fi

      - name: Run tests with coverage (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npm run test:coverage

      - name: Full repo tests (PR advisory)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: npm run test:coverage

      - name: Upload coverage to Codecov (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 3: Build Verification
  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed - dist directory not created"
            exit 1
          fi
          echo "Build successful - dist directory created"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # Job 4: Check bundle size
  bundle-size:
    runs-on: ubuntu-latest
    name: Bundle Size Check
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-output
          path: dist/

      - name: Check bundle size
        run: |
          echo "Checking bundle sizes..."
          ls -lh dist/assets/*.js | awk '{print $9, $5}'

          # Optional: Add bundle size limits here
          # For example, fail if main bundle is over 10MB
          # main_size=$(stat -f%z dist/assets/index-*.js 2>/dev/null || stat -c%s dist/assets/index-*.js)
          # if [ $main_size -gt 10485760 ]; then
          #   echo "Main bundle too large: $main_size bytes"
          #   exit 1
          # fi
