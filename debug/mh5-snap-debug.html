<!DOCTYPE html>
<!--
  MH5 Base Axis Snap Debug Scene
  
  This debug scene uses the SAME snap pipeline as the main app:
  - SceneManager for scene initialization
  - SnappingHelper for snap detection
  - Real preview system from preview.ts
  
  How to run:
  1. Start dev server: npm run dev
  2. Navigate to: http://localhost:5173/debug/mh5-snap-debug.html
  3. Set VITE_DEBUG_SNAP=true in .env or environment to enable verbose logging
  
  The scene will:
  - Load MH5_BASE_AXIS.stl automatically
  - Enable center, face, and midpoint snap
  - Show preview dots/rings as you hover
  - Display snap info in the top-left corner
-->
<html>
<head>
  <meta charset="UTF-8">
  <title>MH5 Base Axis Snap Debug Scene</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: monospace;
      background: #1a1a1a;
    }
    #renderCanvas {
      width: 100%;
      height: 100vh;
      display: block;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 5px;
      font-size: 12px;
      line-height: 1.6;
      max-width: 400px;
    }
    #controls {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 5px;
      font-size: 12px;
    }
    button {
      margin: 5px;
      padding: 8px 12px;
      background: #4a4a4a;
      color: white;
      border: 1px solid #666;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover {
      background: #5a5a5a;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="info">
    <div><strong>MH5 Base Axis Snap Debug</strong></div>
    <div>Initializing...</div>
  </div>
  <div id="controls">
    <div><strong>Controls</strong></div>
    <button id="resetCamera">Reset Camera</button>
    <div style="margin-top: 10px; font-size: 10px; opacity: 0.7;">
      Set VITE_DEBUG_SNAP=true for verbose logs
    </div>
  </div>

  <script type="module" src="./mh5-snap-debug.ts"></script>
</body>
</html>
