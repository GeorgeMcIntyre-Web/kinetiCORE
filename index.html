<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Web-based 3D industrial simulation and kinematics platform" />
    <title>kinetiCORE - Industrial Simulation Platform</title>
    <link rel="stylesheet" href="/src/splash.css" />
  </head>
  <body>
    <div id="root">
      <!-- Static splash screen - shown immediately while React loads -->
      <div id="initial-splash">
        <div class="splash-container">
          <!-- Logo -->
          <div class="splash-logo">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>

          <!-- Title -->
          <h1 class="splash-title">kinetiCORE</h1>

          <!-- Subtitle -->
          <p class="splash-subtitle">INDUSTRIAL SIMULATION PLATFORM</p>

          <!-- Loading bar -->
          <div class="splash-loading-bar-container">
            <div class="splash-loading-bar"></div>
          </div>

          <p class="splash-loading-text">Initializing...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Splash screen removal is now controlled by App.tsx after initialization -->
  </body>
</html>
